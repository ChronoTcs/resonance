name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag to build/update (e.g. v0.1.8-beta)'
        required: false
        default: 'v0.1.8-beta'

permissions:
  contents: write

jobs:
  # ── 1. ANDROID BUILD ──
  build-android:
    name: Build Android APKs (Split & Universal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Extract Version from pubspec.yaml
        id: version_info
        run: |
          RAW_VER=$(grep -m 1 '^version:' pubspec.yaml | awk '{print $2}')
          BASE_VER=$(echo "$RAW_VER" | cut -d'+' -f1)
          BUILD_NUM=$(echo "$RAW_VER" | cut -d'+' -f2)
          if [ -z "$BUILD_NUM" ]; then BUILD_NUM="1"; fi
          echo "base_version=$BASE_VER" >> $GITHUB_OUTPUT
          echo "build_num=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "Extracted Version: $BASE_VER (Build $BUILD_NUM)"

      - name: Setup Signing Keystore (Optional)
        if: env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.jks
          EOF

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APKs (Split per ABI & Universal)
        run: |
          mkdir -p Output
          BASE_VER="${{ steps.version_info.outputs.base_version }}"
          BUILD_NUM="${{ steps.version_info.outputs.build_num }}"

          # 1. Build Split-per-ABI APKs (~35MB for arm64-v8a, ~30MB for armeabi-v7a)
          flutter build apk --release --split-per-abi

          # Proposal B Naming: Clear, beginner-friendly architecture labeling
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "Output/Resonance-v${BASE_VER}.${BUILD_NUM}-Android-64bit-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "Output/Resonance-v${BASE_VER}.${BUILD_NUM}-Android-32bit-v7a.apk"

          # 2. Build Universal APK (Cached compilation, ~96MB fallback for all architectures)
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "Output/Resonance-v${BASE_VER}.${BUILD_NUM}-Android-Universal.apk"

          echo "Packaged Android Binaries:"
          ls -lh Output/

      - name: Upload Android Binaries
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: Output/*.apk

  # ── 2. WINDOWS BUILD & DELTA PATCH ──
  build-windows:
    name: Build Windows Release & Delta Patch
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Build Dependencies
        run: pip install pyinstaller yt-dlp requests mutagen

      - name: Setup FFmpeg Binaries for Bundling
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "python_engine\bin" -Force

          # 1. Check if real static FFmpeg (> 10 MB) is already installed
          $ffmpeg = (Get-Command ffmpeg -ErrorAction SilentlyContinue)?.Source
          $ffprobe = (Get-Command ffprobe -ErrorAction SilentlyContinue)?.Source
          if ($ffmpeg -and (Get-Item $ffmpeg).Length -gt 10MB -and $ffprobe -and (Get-Item $ffprobe).Length -gt 10MB) {
            Copy-Item $ffmpeg "python_engine\bin\ffmpeg.exe" -Force
            Copy-Item $ffprobe "python_engine\bin\ffprobe.exe" -Force
            Write-Host "Bundled pre-installed standalone FFmpeg from runner" -ForegroundColor Green
          } else {
            # 2. Install via Chocolatey and resolve REAL static binaries under lib/ (avoiding 50KB ShimGen shims in bin/)
            choco install ffmpeg --no-progress
            $realFfmpeg = (Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\ffmpeg" -Recurse -Filter "ffmpeg.exe" | Where-Object { $_.Length -gt 10MB } | Select-Object -First 1)?.FullName
            $realFfprobe = (Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\ffmpeg" -Recurse -Filter "ffprobe.exe" | Where-Object { $_.Length -gt 10MB } | Select-Object -First 1)?.FullName

            if ($realFfmpeg -and $realFfprobe) {
              Copy-Item $realFfmpeg "python_engine\bin\ffmpeg.exe" -Force
              Copy-Item $realFfprobe "python_engine\bin\ffprobe.exe" -Force
              Write-Host "Bundled real standalone FFmpeg binaries from Chocolatey lib directory" -ForegroundColor Green
            } else {
              # Fallback: Download official Gyan.dev release essentials zip if chocolatey lib changes
              Write-Host "Chocolatey real binary not found. Downloading official Gyan.dev FFmpeg essentials..." -ForegroundColor Yellow
              Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
              Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
              $realFfmpeg = (Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Where-Object { $_.Length -gt 10MB } | Select-Object -First 1)?.FullName
              $realFfprobe = (Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffprobe.exe" | Where-Object { $_.Length -gt 10MB } | Select-Object -First 1)?.FullName
              Copy-Item $realFfmpeg "python_engine\bin\ffmpeg.exe" -Force
              Copy-Item $realFfprobe "python_engine\bin\ffprobe.exe" -Force
            }
          }

          # 3. Size Assertion: Ensure bundled binaries are authentic full static builds (> 10MB)
          $ffmpegSize = (Get-Item "python_engine\bin\ffmpeg.exe").Length / 1MB
          $ffprobeSize = (Get-Item "python_engine\bin\ffprobe.exe").Length / 1MB
          Write-Host ("Verified FFmpeg:  {0:N2} MB" -f $ffmpegSize) -ForegroundColor Green
          Write-Host ("Verified FFprobe: {0:N2} MB" -f $ffprobeSize) -ForegroundColor Green
          if ($ffmpegSize -lt 10 -or $ffprobeSize -lt 10) {
            throw "Error: FFmpeg or FFprobe is under 10MB. Likely a Chocolatey shim instead of real binary!"
          }

      - name: Compile Python Downloader Engine
        run: python python_engine/build_downloader.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Flutter Windows Application
        env:
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
        run: flutter build windows --release

      - name: Package Portable Zip & Generate Delta Patch
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_INPUT: ${{ inputs.tag_name }}
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Path "Output" -Force

          # Parse pubspec.yaml version
          $pubspec = Get-Content "pubspec.yaml" -Raw
          $versionMatch = [regex]::Match($pubspec, "version:\s*([^\s]+)")
          $rawVersion = if ($versionMatch.Success) { $versionMatch.Groups[1].Value.Trim() } else { "0.1.8-beta+13" }
          $baseVersion = $rawVersion.Split('+')[0]
          $buildNum = if ($rawVersion.Contains('+')) { $rawVersion.Split('+')[1] } else { "1" }

          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:TAG_INPUT }
          if (-not $tag) { $tag = "v$baseVersion" }

          # 1. Create Portable Archive
          $portableZip = "Output\Resonance-$tag-Windows-Portable.zip"
          Compress-Archive -Path "$buildDir\*" -DestinationPath $portableZip -Force
          Write-Host "Created portable archive: $portableZip"

          # 2. Binary Delta Patching against previous release
          try {
            $releases = gh release list --limit 10 --json tagName,isDraft -q '.[] | select(.isDraft == false) | .tagName'
            $prevTag = $releases | Where-Object { $_ -ne $tag } | Select-Object -First 1

            if ($prevTag) {
              Write-Host "Discovered previous release: $prevTag. Downloading portable archive for delta patch..."
              New-Item -ItemType Directory -Path "prev_release" -Force
              gh release download $prevTag --pattern "*Portable.zip" --dir "prev_release"

              $prevZip = Get-ChildItem "prev_release\*.zip" | Select-Object -First 1
              if ($prevZip) {
                Expand-Archive -Path $prevZip.FullName -DestinationPath "prev_release\extracted" -Force

                $safePrev = $prevTag.TrimStart('v') -replace '\+', '.'
                $safeCurr = "$baseVersion.$buildNum"
                $patchName = "Resonance-v$safePrev-to-v$safeCurr-delta.patch"
                $patchPath = "Output\$patchName"

                if (Test-Path "windows\tools\hdiffz.exe") {
                  & "windows\tools\hdiffz.exe" -f -s-64 -c-zstd "prev_release\extracted" "$buildDir" "$patchPath"
                  if (Test-Path $patchPath) {
                    $patchSizeMb = [math]::Round((Get-Item $patchPath).Length / 1MB, 2)
                    Write-Host "Successfully generated delta patch: $patchName ($patchSizeMb MB)" -ForegroundColor Green
                  }
                } else {
                  Write-Warning "windows/tools/hdiffz.exe not found. Skipping delta patch."
                }
              }
            } else {
              Write-Host "No prior release found. Skipping delta patch."
            }
          } catch {
            Write-Warning "Delta patch step encountered error or skipped: $_"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $pubspec = Get-Content "pubspec.yaml" -Raw
          $versionMatch = [regex]::Match($pubspec, "version:\s*([^\s]+)")
          $baseVersion = if ($versionMatch.Success) { $versionMatch.Groups[1].Value.Trim().Split('+')[0] } else { "0.1.8-beta" }

          $innoCompiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $innoCompiler)) {
            $innoCompiler = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          & "$innoCompiler" "/DMyAppVersion=$baseVersion" "/OOutput" windows\resonance_installer.iss

      - name: Upload Windows Binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: Output/*

  # ── 3. PUBLISH GITHUB RELEASE ──
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Resolve Release Tag & Notes
        id: meta
        env:
          TAG_INPUT: ${{ inputs.tag_name }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || env.TAG_INPUT }}"
          if [ -z "$TAG" ]; then
            RAW_VER=$(grep -m 1 '^version:' pubspec.yaml | awk '{print $2}')
            BASE_VER=$(echo "$RAW_VER" | cut -d'+' -f1)
            TAG="v$BASE_VER"
          fi

          NOTES_FILE="reports/releases/release_${TAG}_notes.md"
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE=$(ls reports/releases/*.md 2>/dev/null | head -n 1)
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "notes=$NOTES_FILE" >> $GITHUB_OUTPUT
          echo "Target Release Tag: $TAG"
          echo "Release Notes File: $NOTES_FILE"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Resonance ${{ steps.meta.outputs.tag }}
          body_path: ${{ steps.meta.outputs.notes }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            android-binaries/*.apk
            windows-binaries/*.exe
            windows-binaries/*.zip
            windows-binaries/*.patch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
